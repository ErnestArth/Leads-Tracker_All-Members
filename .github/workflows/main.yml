name: .github/workflows/main.yml

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: leads-tracker
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Run unit tests
      run: npm run test:ci
    
    - name: Build application
      run: npm run build --configuration=production
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: angular-build
        path: dist/
        retention-days: 1

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: angular-build
        path: dist/
    
    - name: Deploy to staging
      env:
        EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
      run: |
        # Setup SSH
        mkdir -p ~/.ssh
        echo "$EC2_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
        
        # Create deployment archive
        cd dist
        tar -czf ../angular-app-$(date +%Y%m%d-%H%M%S).tar.gz .
        cd ..
        
        # Upload and deploy
        scp angular-app-*.tar.gz $EC2_USER@$EC2_HOST:/tmp/
        ssh $EC2_USER@$EC2_HOST << 'EOF'
          sudo mkdir -p /var/www/staging
          sudo rm -rf /var/www/staging/*
          cd /tmp
          sudo tar -xzf angular-app-*.tar.gz -C /var/www/staging/
          sudo chown -R www-data:www-data /var/www/staging
          sudo systemctl reload nginx
          rm -f angular-app-*.tar.gz
        EOF

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Configure SSH
      env:
        EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        EC2_HOST: ${{ secrets.PRODUCTION_EC2_HOST }}
      run: |
        mkdir -p ~/.ssh
        echo "$EC2_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
    
    - name: Run deployment script
      env:
        EC2_HOST: ${{ secrets.PRODUCTION_EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_KEY_PATH: ~/.ssh/id_rsa
      run: |
        # Make script executable
        chmod +x deploy.sh
        
        # Run deployment
        ./deploy.sh
    
    - name: Notify deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Angular app deployment to production: ${{ job.status }}
          URL: http://${{ secrets.PRODUCTION_EC2_HOST }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
