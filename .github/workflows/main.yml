name: Deploy Angular App to EC2

on:
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Angular works fine with Node 18

      # 3️⃣ Install dependencies and build Angular app
      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build --prod

      # 4️⃣ Create private key file
      - name: Create private key file
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" | tr -d '\r' > private_key.pem
          chmod 600 private_key.pem

      # 5️⃣ Copy build files to EC2
      - name: Copy files to EC2
        run: |
          scp -i private_key.pem -o StrictHostKeyChecking=no -r dist/*/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      # 6️⃣ Deploy on EC2
      - name: Deploy on EC2
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo rm -rf /var/www/html/*
            sudo mv /tmp/* /var/www/html/
            sudo chown -R nginx:nginx /var/www/html
            sudo systemctl restart nginx
          EOF
