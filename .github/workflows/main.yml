---
name: Deploy Angular App to EC2

on:
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build --if-present

      - name: Create SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > private_key
          chmod 600 private_key

      - name: Copy built files to EC2
        run: >
          scp -i private_key -o StrictHostKeyChecking=no
          -r dist/*/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      - name: Deploy to nginx directory
        run: |
          ssh -i private_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
              sudo rm -rf /var/www/html/*
              sudo cp -r /tmp/* /var/www/html/
              sudo systemctl restart nginx
              sudo rm -rf /tmp/*
          EOF

      - name: Cleanup private key
        run: rm -f private_key
