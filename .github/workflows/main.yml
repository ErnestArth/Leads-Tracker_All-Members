name: Deploy Angular App to EC2

on:
  push:
    branches:
      - main   # change if your default branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Angular 15+ works with Node 18

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }} # your .pem key content
          HOST: ${{ secrets.EC2_HOST }}               # e.g. ec2-xx-xx-xx-xx.compute.amazonaws.com
          USER: ${{ secrets.EC2_USER }}               # usually "ec2-user" for Amazon Linux
        run: |
          # Save private key
          echo "$PRIVATE_KEY" | tr -d '\r' > private_key
          chmod 600 private_key

          # Upload build to a safe temp folder
          scp -i private_key -o StrictHostKeyChecking=no -r dist/*/* ${USER}@${HOST}:/tmp/deploy_build/

          # SSH into server and deploy
          ssh -i private_key -o StrictHostKeyChecking=no ${USER}@${HOST} << 'EOF'
            sudo rm -rf /var/www/html/*
            sudo mkdir -p /var/www/html
            sudo cp -r /tmp/deploy_build/* /var/www/html/
            sudo chown -R nginx:nginx /var/www/html
            sudo systemctl restart nginx
            rm -rf /tmp/deploy_build
          EOF

          # Cleanup key
          rm -f private_key
