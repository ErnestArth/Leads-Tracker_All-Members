name: Deploy Angular App to EC2

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the selected branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 4️⃣ Build Angular app
      - name: Build Angular app
        run: npm run build --configuration production

      # 5️⃣ Detect build folder (SSR or normal)
      - name: Detect build folder
        id: detect_build
        run: |
          APP_NAME=$(ls dist)
          if [ -d "dist/$APP_NAME/browser" ]; then
            echo "BUILD_PATH=dist/$APP_NAME/browser" >> $GITHUB_ENV
          else
            echo "BUILD_PATH=dist/$APP_NAME" >> $GITHUB_ENV
          fi

      # 6️⃣ Create private key file
      - name: Create private key file
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > private_key.pem
          chmod 600 private_key.pem

      # 7️⃣ Copy build files to EC2
      - name: Copy files to EC2
        run: |
          scp -i private_key.pem -o StrictHostKeyChecking=no -r $BUILD_PATH/* \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      # 8️⃣ Deploy on EC2
      - name: Deploy on EC2
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo rm -rf /var/www/html/*
            sudo mv /tmp/* /var/www/html/
            sudo chown -R nginx:nginx /var/www/html
            sudo systemctl restart nginx
          EOF
