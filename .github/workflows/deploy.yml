name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Angular application
      run: npm run build --prod

    - name: Deploy to EC2
      run: |
        set -e

        # Decode the base64-encoded SSH key
        echo "$PRIVATE_KEY_BASE64" | base64 -d > private_key
        chmod 600 private_key

        # Copy built files to EC2
        scp -i private_key -o StrictHostKeyChecking=no -r dist/*/* ${USER}@${HOST}:/tmp/

        # SSH and deploy
        ssh -i private_key -o StrictHostKeyChecking=no ${USER}@${HOST} bash <<EOF
          sudo cp -r /tmp/* /var/www/html/
          sudo systemctl restart nginx
          sudo rm -rf /tmp/*
EOF

        # Clean up
        rm -f private_key
      env:
        PRIVATE_KEY_BASE64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
