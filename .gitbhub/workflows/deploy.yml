name: Deploy Angular App to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build Angular app
      run: npm run build --prod

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        # Create private key file without Windows line endings
        echo "$PRIVATE_KEY" | tr -d '\r' > private_key
        chmod 600 private_key

        # Copy build files to EC2
        scp -i private_key -o StrictHostKeyChecking=no -r dist/*/* ${USER}@${HOST}:/tmp/

        # SSH into EC2 and deploy
        ssh -i private_key -o StrictHostKeyChecking=no ${USER}@${HOST} << 'EOF'
          sudo rm -rf /var/www/html/*
          sudo cp -r /tmp/* /var/www/html/
          sudo systemctl restart nginx
          rm -rf /tmp/*
        EOF

        # Cleanup
        rm -f private_key
