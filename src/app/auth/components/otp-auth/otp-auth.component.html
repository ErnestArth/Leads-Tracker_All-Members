<div class="login-container">
  <img src="OTP Vector.jpg" alt="Vector Image" class="vector-image" />
  <div class="login-content">
    <img src="Lead Tracker Logo.jpg" alt="LeadTracker Logo" class="logo" />
    <div class="login-text">
      <h3 class="welcome-text">Welcome back to Leads Tracker</h3>
      <span>Admin acess only</span>
    </div>
    <div class="login-form">
      <p class="access-text">
        Enter your assigned credentials to <br />
        access your account
      </p>

      <form formGroup="loginForm" (ngSubmit)="onSubmit()">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="email@email.com"
        />
        <div
          *ngIf="
            loginForm.get('email')?.invalid && loginForm.get('email')?.touched
          "
          class="error-message"
        >
          <small
            class="error-text"
            *ngIf="loginForm.get('email')?.errors?.['required']"
            >Email is required.</small
          >
          <small
            class="error-text"
            *ngIf="loginForm.get('email')?.errors?.['email']"
            >Please enter a valid email address.</small
          >
        </div>

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter Password"
        />
        <div
          *ngIf="
            loginForm.get('Password')?.invalid &&
            loginForm.get('Password')?.touched
          "
          class="error-message"
        >
          <small
            class="error-text"
            *ngIf="loginForm.get('Password')?.errors?.['required']"
            >Password is required.</small
          >
          <small
            class="error-text"
            *ngIf="loginForm.get('Password')?.errors?.['minlength']"
            >Password must be at least 8 characters long.</small
          >
        </div>

        <div class="login-button">
          <button type="submit">Login</button>
        </div>
      </form>
    </div>
  </div>
  <img src="OTP Login.jpg" alt="tracker-image" class="login-image" />
</div>
