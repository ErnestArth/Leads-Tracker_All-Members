<img src="OTP Vector" alt="Vector Image" class="vector-image" />
<div class="login-container">
  <div>
    <img src="Lead Tracker Logo.jpg" alt="LeadTracker Logo" class="logo" />
    <div>
      <h2>Hi <span>[Admin Name]</span></h2>
      <h3>Welcome to Leads Tracker!</h3>
      <div class="login-form">
        <!-- <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"> -->
        <div class="form-group">
          <p class="login-text">
            Enter your assigned credentials to <br />
            access your account
          </p>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="email@email.com"
          />
        </div>
        <!-- </form> -->
        <form class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Enter Password"
          />
        </form>
        <div class="form-group">
          <!-- <button type="submit" [disabled]="loginForm.invalid">Login</button> -->
        </div>
      </div>
    </div>
  </div>
  <img src="OTP Login.jpg" alt="tracker-image" class="otp-login" />
</div>
