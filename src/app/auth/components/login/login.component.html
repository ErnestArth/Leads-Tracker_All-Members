<img src="Vector.jpg" alt="Vector Image" class="vector-image" />
<div class="login-container">
  <div class="login-content">
    <img src="Lead Tracker Logo.jpg" alt="LeadTracker Logo" class="logo" />
    <div class="login-text">
      <span>Hi Admin,</span>
      <h3 class="welcome-text">Welcome to Leads Tracker!</h3>
    </div>
    <div class="login-form">
      <p class="access-text">
        Enter your assigned credentials to <br />
        access your account
      </p>

      <form
      [formGroup] ="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="email@email.com"
          />
          <div  *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"   >
            <small
              class="error-text"
              *ngIf="loginForm.get('email')?.errors?.['required']"
              >Email is required</small
            >
            <small
              class="error-text"
              *ngIf="loginForm.get('email')?.errors?.['email']"
              >Invalid email format</small
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Enter Password"
          />
          <div
            *ngIf="
              loginForm.get('Password')?.invalid &&
              loginForm.get('Password')?.touched
            "
            class="error-message"
          >
            <small
              class="error-text"
              *ngIf="loginForm.get('Password')?.errors?.['required']"
              >Password is required.</small
            >
            <small
              class="error-text"
              *ngIf="loginForm.get('Password')?.errors?.['minlength']"
              >Password must be at least 8 characters long.</small
            >
          </div>
        </div>
        <div class="login-button">
          <button type="submit">
            Login <img src="black-down.png" alt="arrow" />
          </button>
        </div>
      </form>
    </div>
  </div>
  <img src="Frame 2.jpg" alt="tracker-image" class="login-image" />
</div>
