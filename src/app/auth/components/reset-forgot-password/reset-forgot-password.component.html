<div class="reset-password-container">
  <img src="Reset Password Vector.png" alt="reset-vector" />
  <div>
    <h1 class="heading">RESET PASSWORD</h1>
    <div class="reset-details">
      <p class="reset-text">
        For security, please create a new password <br> before accessing your
        dashboard.
    </p>

    <form formGroup="resetForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        formControlName="newPassword"
        placeholder="Enter Password"
      />
    </div>
    <div class="form-group">
      <label for="confirmNewPassword">Confirm New Password</label>
      <input
        type="password"
        id="confirmNewPassword"
        formControlName="confirmNewPassword"
        placeholder="Re-enter a new Password"
      />
    </div>
    <div class="update-password-button">
          <button type="submit">
            Update Password
          </button>
    </div>
    </form>
  </div>
  </div>
  <div class="validation-notice">
    <p>Your Password must: <br>
      Be at least 8 characters
      Include uppercase and lowercase letters
      Include a number
      Include a special charater (e.g., !,&#64;,#)
    </p>
  </div>
</div>
