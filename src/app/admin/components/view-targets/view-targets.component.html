<div class="dashboard-container">
  <app-sidebar />
  <main>
    <div class="container">
      <div class="header">
        <span
          class="back-arrow"
          (click)="onBackArrow('dashboard')"
          routerLink="/admin/dashboard"
          routerLinkActive="selected"
        >
          <img src="Back arrow.png" alt="back-arrow" />
        </span>
        <h2>Team Targets Overview</h2>
      </div>

      <div class="controls">
        <input
          type="text"
          class="search-input"
          placeholder="Search by Team"
        />
        <select
          title="frequency"
          [(ngModel)]="selectedFrequency"
          class="select-input"
        >
          <option value="Quarterly">Monthly</option>
          <option value="Monthly">Quarterly</option>
          <option value="Yearly">Yearly</option>
        </select>
      </div>

      <!-- Show loader or error -->
      <div *ngIf="isLoading">Loading targets...</div>
      <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

      <!-- Target Cards -->
      <div class="team-card" *ngFor="let team of teams">
        <div class="card-header">
          <div class="avatar"></div>
          <div class="info">
            <div class="team-name">{{ team.teamName }}</div>
            <div class="lead">Lead: {{ team.teamLeadFullName }}</div>
          </div>
          <div class="dates">
            <!-- Optional static Set Date; you may remove this if backend doesn't support it -->
            <!-- <div><strong>Set Date:</strong> {{ team.setDate }}</div> -->
            <div><strong>Due Date:</strong> {{ team.dueDate | date: 'longDate' }}</div>
          </div>
        </div>

        <div class="target-info">
          <strong>Target:</strong> {{ team.targetValue }}
          <br />
          Total Recommendations Submitted:
          <strong>-- / {{ team.targetValue }}</strong>
        </div>

        <div class="progress-bar-wrapper">
          <div
            class="progress-bar-fill"
            [style.width.%]="getProgress(team.targetValue, team.targetValue)"
          ></div>
        </div>

        <div class="view-details">
          <a routerLink="/admin/team-breakdown">View Details</a>
        </div>
      </div>

      <!-- No results -->
      <div *ngIf="!isLoading && !teams.length" class="no-results">
        No team targets found.
      </div>
    </div>
  </main>
</div>
