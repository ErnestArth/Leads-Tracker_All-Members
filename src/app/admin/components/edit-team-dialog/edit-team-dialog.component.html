

<mat-dialog-content>
    <div class="edit-team-modal">
        <div class="title">Edit Team</div>
        <form [formGroup]="editTeamForm"  action="">
          <div class="form-group">
            <label>Team Name</label>
            <input formControlName="name" placeholder="Input team name" type="text" />
          </div>
          <div class="form-group">
            <label>Assign Team Lead</label>
            <select  formControlName="teamLeadUserId" class="select-team-lead" title="team-lead" id="team-lead">
              <option *ngFor="let teamLead of allTeamLeads" value="{{teamLead.teamLeadUserId}}">{{teamLead.teamLeadName}}</option>
              <!-- <option value="">Kwadwo</option>
              <option value="">Ama</option> -->
            </select>
          </div>
        </form>
        <div class="cancel-save-buttons">
          <button (click)="closeModal()"  class="cancel-button">cancel</button>
          <button  class="save-button">save Changes</button>
        </div>
      </div>
    </mat-dialog-content>
