    <app-sidebar />
  </div>

            src="dashboard-images/Headshot 2.jpg"
            alt="profile-image"
            class="profile-image"
          />
        </div>
      </div>
    </aside>

    <div class="main-content">
      <div class="dashboard-content">
        <div class="search-container">
          <input
            type="search"
            name="searchTeamLeads"
            id=""
            placeholder="Search by Name ..."
          />

          <div class="team-search">
            <label for="options">Duration</label>
            <select id="options" name="options" class="team-select">
              <option value="all">This Month</option>
              <option value="team1">Team 1</option>
              <option value="team2">Team 2</option>
              <option value="team3">Team 3</option>
              <option value="team4">Team 4</option>
            </select>
          </div>
        </div>

        <div class="team-lead-dash-cards-container">
          <div
            *ngFor="let team of allTeams"
            class="team-lead-dash-cards"
          >
            <div class="dash-cards-top-info">
              <div class="team-lead-info-and-view-details">
                <div class="team-lead-info">
                  <div class="team-lead-info-image">
                    <img class="user-image" src="user-1.jpg" alt="user" />
                  </div>
                  <div class="team-lead-info-name-and-">
                    <p
                      class="team-lead-name"
                      [routerLink]="['/admin/teams', team.teamId]"
                    >
                      {{ team.teamName }}
                    </p>
                    <span class="team-lead-email">{{ team.teamLeadName }}</span>
                  </div>
                </div>

                <div class="horizontal-dots">
                  <button
                    title="button"
                    matButton
                    [matMenuTriggerFor]="beforeMenu"
                  >
                    <svg
                      width="25"
                      height="25"
                      viewBox="0 0 25 25"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M12.1927 14.1656C11.2538 14.1656 10.4927 13.4045 10.4927 12.4656C10.4927 11.5267 11.2538 10.7656 12.1927 10.7656C13.1316 10.7656 13.8927 11.5267 13.8927 12.4656C13.8927 13.4045 13.1316 14.1656 12.1927 14.1656Z"
                        fill="black"
                      />
                      <path
                        d="M13.8927 5.76465C13.8926 6.70344 13.1313 7.46484 12.1925 7.46484C11.2538 7.46474 10.4924 6.70338 10.4923 5.76465C10.4923 4.82583 11.2537 4.06456 12.1925 4.06445C13.1314 4.06445 13.8927 4.82576 13.8927 5.76465ZM13.8927 19.1641C13.8927 20.1029 13.1314 20.8643 12.1925 20.8643C11.2537 20.8642 10.4923 20.1029 10.4923 19.1641C10.4925 18.2254 11.2538 17.4649 12.1925 17.4648C13.1313 17.4648 13.8925 18.2253 13.8927 19.1641Z"
                        fill="black"
                      />
                    </svg>
                  </button>

                  <!-- <button matButton [matMenuTriggerFor]="menu">Menu</button> -->
                  <mat-menu #beforeMenu="matMenu" xPosition="before">
                    <button
                      mat-menu-item
                      (click)="openEditTeam(team.teamId)"
                      class="card-link"
                    >
                      Edit
                    </button>
                    <button
                      title="button"
                      mat-menu-item
                      (click)="openModal('deactivateTeam')"
                      class="card-link"
                    >
                      Deactivate
                    </button>
                  </mat-menu>

                  <!-- @if (selectedTeam === team.teamId){
                  <div class="card-menu">
                    <ul>
                      <li (click)="openModal('editTeam')" class="card-link">
                        Edit
                      </li>
                      <li
                        (click)="openModal('deactivateTeam')"
                        class="card-link"
                      >
                        Deactivate
                      </li>
                    </ul>
                  </div>
                  } -->
                </div>
              </div>

              <div class="team-members-and-progress-bar">
                <div class="progress-bar">
                  <p>Total Clients Onboarded: <span><span class="team-target-achieved {{progressTextColor}}">{{team.totalClientsAdded}}</span> / <span class="team-target">{{team.teamTarget}}</span></span></p>
                  <div class="progress-outline " [ngClass]="team.progressOutlineColor">
                    <div class="progress {{progressColor}}" [ngClass]="team.progressColor" [ngStyle]="{ width: team.progressPercentage+'%', backgroundColor: team.progressColor}" ></div>
                    <span class="progress-percentage" [ngClass]="team.progressTextColor">{{team.progressPercentage}}% </span>
                  </div>
                </div>
              </div>
            </div>

            <div class="dash-cards-down-info">
              <div class="no-of-members-and-pics">
                <p>{{team.numberOfTeamMembers}} Members</p>
                <div class="members-images">
                  <img src="user-1.jpg" alt="members-img" />
                  <img src="user-1.jpg" alt="members-img" />
                  <img src="user-1.jpg" alt="members-img" />
                  <img src="user-1.jpg" alt="members-img" />
                  <img src="user-1.jpg" alt="members-img" />
                </div>
              </div>
              <div
                class="view-details"
                [routerLink]="['/admin/teams', team.teamId]"
              >
                <p>View Details</p>
              </div>
            </div>
          </div>
