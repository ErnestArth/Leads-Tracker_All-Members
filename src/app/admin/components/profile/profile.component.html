<div class="dashboard-container">
  <app-sidebar />
  <main>
    <aside class="profile-header">
      <span
        class="back-arrow"
        (click)="onBackArrow('dashboard')"
        routerLink="/admin/dashboard"
        routerLinkActive="selected"
        ><img src="Back arrow.png" alt="back-arrow"
      /></span>
      <h2>Profile</h2>
    </aside>
    <div class="form-container">
      <form [formGroup]="profileForm">
        <section class="section">
          <h3>Personal Info</h3>
          <div class="form-group">
            <label>First Name</label>
            <input
              title="form"
              formControlName="firstName"
              type="text"
              value="Read-only text"
            />
          </div>

          <div class="form-group">
            <label>Other Name(s)</label>
            <input
              title="form"
              formControlName="otherNames"
              type="text"
              value="Read-only text"
            />
          </div>

          <div class="form-group">
            <label>Business Email</label>
            <input
              title="form"
              formControlName="businessEmail"
              type="email"
              value="Read-only text"
            />
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input title="form" formControlName="phoneNumber" type="text" />
          </div>

          <div class="form-group">
            <label>Role</label>
            <input
              title="admin"
              formControlName="role"
              type="role"
              value="Read-only text"
            />
          </div>
        </section>

        <section class="security-screen">
          <div class="security-details">
            <h3 (click)="toggleSecurity()" class="dropdown-toggle">
              Security
              <img src="down-arrow.png" alt="arrow" class="down-arrow.png" />
              <span [class.rotate]="showSecurity" class="showSecurity"></span>
            </h3>
            <h4 *ngIf="showSecurity">Change Password</h4>

            <div *ngIf="showSecurity" class="password-container">
              <label class="password" for="currentPassword"
                >Current Password</label
              >

              <input
                class="security-input"
                id="currentPassword"
                [type]="showCurrentPassword ? 'text' : 'password'"
                formControlName="currentPassword"
                (input)="checkPasswordRules()"
                placeholder="Current Password"
                [ngClass]="{
                'invalid-input': profileForm.get('password')?.invalid && profileForm.get('password')?.touched,

              }"
              />

              <span
                toggle="#password-field"
                class="fa fa-fw fa-eye-slash field-icon eye1 toggle-password"
                [ngClass]="{
                  'fa-eye-slash': !fieldTextType,
                  'fa-eye': fieldTextType
                }"
                (click)="toggleFieldTextType('current')"
              ></span>
            </div>

            <div *ngIf="showSecurity" class="password-container">
              <label>New Password</label>

              <input
                class="security-input"
                id="newPassword"
                [type]="showNewPassword ? 'text' : 'password'"
                formControlName="newPassword"
                (input)="checkPasswordRules()"
                placeholder="New Password"
                [ngClass]="{
                'invalid-input': profileForm.get('password')?.invalid && profileForm.get('password')?.touched,

              }"
              />

              <span
                toggle="#password-field"
                class="fa fa-fw fa-eye-slash field-icon eye2 toggle-password"
                [ngClass]="{
                  'fa-eye-slash': !fieldTextType,
                  'fa-eye': fieldTextType
                }"
                (click)="toggleFieldTextType('new')"
              ></span>
            </div>

            <div *ngIf="showSecurity" class="password-container">
              <label>Confirm New Password</label>

              <input
                class="security-input"
                id="confirmNewPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
                formControlName="password"
                (input)="checkPasswordRules()"
                placeholder="Confirm New Password"
                [ngClass]="{
                'invalid-input': profileForm.get('password')?.invalid && profileForm.get('password')?.touched,

              }"
              />

              <span
                toggle="#password-field"
                class="fa fa-fw fa-eye-slash field-icon eye1 toggle-password"
                [ngClass]="{
                  'fa-eye-slash': !fieldTextType,
                  'fa-eye': fieldTextType
                }"
                (click)="toggleFieldTextType('confirm')"
              ></span>
            </div>
          </div>

          <button
            *ngIf="showSecurity"
            type="button"
            class="change-btn"
            (click)="onChangePassword()"
          >
            Change Password
          </button>
        </section>
      </form>
      <div class="cancel-save-buttons">
        <button type="button" (click)="cancel()" class="cancel-button">
          Cancel
        </button>
        <button type="submit" (click)="onSaveChanges()" class="save-button">
          Save Changes
        </button>
      </div>
    </div>
  </main>
</div>
